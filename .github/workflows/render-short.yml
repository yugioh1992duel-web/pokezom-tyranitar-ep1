# Pokezom traffic Short render — GitHub Actions (same pattern as render-episode)
name: render-short
on:
  workflow_dispatch:
    inputs:
      sections:
        description: 'JSON array of short segments to render'
        required: true
        default: '["sA","sB","sC","sD"]'
jobs:
  render-sections:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        section: ${{ fromJSON(inputs.sections) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            ~/.npm
          key: hf-0.8.217-${{ runner.os }}
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render segment
        working-directory: shorts/segments/${{ matrix.section }}
        env:
          TMPDIR: /tmp
          HF_SEGMENTED_CAPTURE: "true"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: npx --yes hyperframes@0.8.217 render --resume -f 60
      - uses: actions/upload-artifact@v4
        with:
          name: short-${{ matrix.section }}
          path: |
            shorts/segments/${{ matrix.section }}/renders/*/video-only.mp4
            shorts/segments/${{ matrix.section }}/renders/*.mp4
          if-no-files-found: error
          retention-days: 1
