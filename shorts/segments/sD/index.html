/* continuous flow: linear legs with frame-wrap sets, all precomputed */
document.querySelectorAll('[data-flow]').forEach(m => {
  const F = JSON.parse(m.dataset.flow);
  const lox = -110 - F.bx, hix = 1130 - F.bx, loy = -110 - F.by, hiy = 1970 - F.by;
  let t = 0, ox = 0, oy = 0;
  while (t < DUR - 0.01) {
    const tx = F.vx > 0 ? (hix - ox) / F.vx : F.vx < 0 ? (lox - ox) / F.vx : 1e9;
    const ty = F.vy > 0 ? (hiy - oy) / F.vy : F.vy < 0 ? (loy - oy) / F.vy : 1e9;
    const dtEvent = Math.min(tx, ty), dt = Math.min(dtEvent, DUR - t);
    const nx = ox + F.vx * dt, ny = oy + F.vy * dt;
    tl.to(m, { x: nx, y: ny, duration: dt, ease: 'none' }, t);
    t += dt; ox = nx; oy = ny;
    if (dt >= dtEvent - 1e-6 && t < DUR - 0.01) {
      if (tx <= ty) ox = F.vx > 0 ? lox : hix; else oy = F.vy > 0 ? loy : hiy;
      tl.set(m, { x: ox, y: oy }, t);
    }
  }
  tl.to(m, { opacity: Math.max(.1, F.o - .2), duration: F.twk, yoyo: true, repeat: Math.max(0, Math.ceil(DUR / F.twk) - 1), ease: 'sine.inOut' }, 0);

    const r = Math.hypot(R.ox, R.oy), spd = Math.hypot(R.vx, R.vy);
    const dt = Math.min((S.R - r) / spd, DUR - t);
    tl.to(m, { opacity: S.o, duration: Math.min(.3, dt * .4), ease: 'power1.out' }, t);
    tl.to(m, { x: R.ox + R.vx * dt, y: R.oy + R.vy * dt, duration: dt, ease: 'none' }, t);
    tl.to(m, { opacity: 0, duration: Math.min(.35, dt * .3), ease: 'power1.in' }, Math.max(t, t + dt - Math.min(.35, dt * .3)));

});

(C.envFX || []).forEach((fx, fi) => {
  const host = '#envfx' + fi;
  tl.to(host, { opacity: 1, duration: .8 }, fx.at);
  if (fx.out) tl.to(host, { opacity: 0, duration: .9 }, fx.out);
  if (fx.kind === 'sand') {
    document.querySelectorAll(host + ' .sandP').forEach(p => {
      const sp = parseFloat(p.dataset.speed);
      const reps = Math.ceil(((fx.out || DUR) - fx.at) / (2600 / sp));
      tl.fromTo(p, { x: 0 }, { x: -sp * .55, duration: 2600 / sp, repeat: Math.max(0, reps - 1), ease: 'none' }, fx.at);
    });
  }
  if (fx.kind === 'future') {
    document.querySelectorAll(host + ' .pillar').forEach((pl, pi) => {
      tl.to(pl, { opacity: .55, duration: 1.6 + pi * .3, yoyo: true, repeat: Math.ceil(DUR / 3.2), ease: 'sine.inOut' }, fx.at);
    });
  }
});
(C.headlines || []).forEach((h, i) => {
  tl.fromTo('#hl' + i, { opacity: 0, scale: .8, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: .38, ease: 'back.out(2.2)' }, h.at);
  if (h.out) tl.to('#hl' + i, { opacity: 0, duration: .35 }, h.out);
});
(C.chips || []).forEach((ch, i) => {
  tl.fromTo('#chip' + i, { opacity: 0, scale: .7 }, { opacity: 1, scale: 1, duration: .3, ease: 'back.out(2.6)' }, ch.at);
  if (ch.out) tl.to('#chip' + i, { opacity: 0, duration: .3 }, ch.out);
});
if (C.loadBar) {
  tl.fromTo('#loadBar', { opacity: 0 }, { opacity: 1, duration: .3 }, C.loadBar.at);
  tl.fromTo('#loadFill', { scaleX: 0 }, { scaleX: 1, duration: Math.max(.5, C.loadBar.out - C.loadBar.at - .4), ease: 'power1.inOut' }, C.loadBar.at + .15);
  tl.to('#loadBar', { opacity: 0, duration: .35 }, C.loadBar.out);
}
if (C.quoteCard) {
  tl.fromTo('#quoteCard', { opacity: 0, scale: .92 }, { opacity: 1, scale: 1, duration: .45, ease: 'back.out(1.5)' }, C.quoteCard.at);
  tl.to('#quoteCard', { opacity: 0, duration: .4 }, C.quoteCard.out);
  if (C.quoteCard.hideName) {
    tl.to('#nameBlock', { opacity: 0, duration: .3 }, C.quoteCard.at - .35);
    tl.to('#nameBlock', { opacity: 1, duration: .35 }, C.quoteCard.out + .45);
  }
}
if (C.titleCard) {
  tl.fromTo('#titleCard', { opacity: 0, scale: .94 }, { opacity: 1, scale: 1, duration: .5, ease: 'back.out(1.4)' }, C.titleCard.at);
  if (C.titleCard.out) tl.to('#titleCard', { opacity: 0, duration: .4 }, C.titleCard.out);
}
if (C.statAnim) {
  const o = { v: C.statAnim.from };
  const el = document.createElement('div'); el.className = 'chip'; el.id = 'statChip';
  el.style.cssText = `left:${C.statAnim.x}px; top:${C.statAnim.y}px; font-size:40px;`;
  el.innerHTML = `${C.statAnim.label} <span class="gold">${C.statAnim.from}</span>`;
  $('#fxLayer').appendChild(el);
  tl.fromTo('#statChip', { opacity: 0, scale: .7 }, { opacity: 1, scale: 1, duration: .35, ease: 'back.out(2.4)' }, C.statAnim.at);
  tl.to(o, { v: C.statAnim.to, duration: 1.1, ease: 'power2.inOut', onUpdate: () => {
    el.innerHTML = `${C.statAnim.label} <span class="gold">${Math.round(o.v)}</span>`; } }, C.statAnim.at + .2);
  if (C.statAnim.out) tl.to('#statChip', { opacity: 0, duration: .35 }, C.statAnim.out);
}
(C.clips || []).forEach((cl, i) => {
  const frames = document.querySelectorAll('#clip' + i + ' img');
  const st = { f: 0 };
  tl.to('#clip' + i, { opacity: 1, duration: .3 }, cl.at);
  if (cl.mode === 'full') tl.to('#clipVeil', { opacity: 1, duration: .3 }, cl.at);
  if (cl.mode === 'full' || cl.hideHud) {
    /* keep footage clean: series HUD (name block, heroes) steps aside.
       Scoped per hero: only heroes whose window overlaps the clip hide/restore.
       A blanket restore resurrects heroes that have not entered yet (s0 hook bug:
       Iron Thorns + Mega plates forced visible during Pupitar's window). */
    tl.to('#nameBlock', { opacity: 0, duration: .3 }, cl.at - .35);
    const affected = (C.heroes || []).map((h, hi) => ({ h, hi })).filter(({ h }) => h.in < cl.at + cl.dur && (h.out ?? DUR) > cl.at);
    affected.forEach(({ hi }) => {
      ['#hero' + hi, '#glow' + hi, '#pool' + hi].forEach(sel => tl.to(sel, { opacity: 0, duration: .3 }, cl.at - .35));
    });
    tl.to('#nameBlock', { opacity: 1, duration: .35 }, cl.at + cl.dur + .4);
    affected.forEach(({ h, hi }) => {
      if (h.in > cl.at && h.in < cl.at + cl.dur) {
        tl.to('#hero' + hi, { opacity: 0, duration: .05, overwrite: 'auto' }, h.in + .02);
        tl.to('#glow' + hi, { opacity: 0, duration: .05, overwrite: 'auto' }, h.in + .12);
      }
      if ((h.out ?? DUR) > cl.at + cl.dur) {
        tl.to('#hero' + hi, { opacity: 1, duration: .35 }, cl.at + cl.dur + .4);
        tl.to('#glow' + hi, { opacity: .85, duration: .35 }, cl.at + cl.dur + .4);
        tl.to('#pool' + hi, { opacity: 1, duration: .35 }, cl.at + cl.dur + .4);
      }
    });
  }
  if (cl.label) tl.to('#clipTag' + i, { opacity: 1, duration: .3 }, cl.at + .15);
  tl.to(st, { f: cl.frames - 1, duration: cl.dur, ease: 'none', onUpdate: () => {
    const idx = Math.round(st.f);
    frames.forEach((im, fi) => im.style.opacity = fi === idx ? 1 : 0);
  } }, cl.at);
  tl.to('#clip' + i, { opacity: 0, duration: .35 }, cl.at + cl.dur);
  if (cl.mode === 'full') tl.to('#clipVeil', { opacity: 0, duration: .35 }, cl.at + cl.dur);
  if (cl.label) tl.to('#clipTag' + i, { opacity: 0, duration: .3 }, cl.at + cl.dur - .1);
});
(C.stills || []).forEach((st, i) => {
  tl.fromTo('#still' + i, { opacity: 0, scale: .94, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: .4, ease: 'back.out(1.5)' }, st.at);
  if (st.label) tl.to('#stillTag' + i, { opacity: 1, duration: .3 }, st.at + .15);
  tl.to('#still' + i, { opacity: 0, duration: .35 }, st.out);
  if (st.label) tl.to('#stillTag' + i, { opacity: 0, duration: .25 }, st.out - .05);
});
if (C.ranking) {
  C.ranking.slots.forEach((s, i) => {
    tl.fromTo('#rank' + i, { opacity: 0, y: 30 }, { opacity: .38, y: 0, duration: .45 }, s.in);
  });
  (C.ranking.hits || []).forEach(hit => {
    const i = hit.idx;
    tl.to('#rank' + i, { opacity: 1, scale: 1.1, duration: .32, ease: 'back.out(2)' }, hit.t);
    tl.fromTo('#rankNum' + i, { opacity: 0, scale: .5 }, { opacity: 1, scale: 1, duration: .32, ease: 'back.out(2.4)' }, hit.t);
    tl.to('#rankName' + i, { opacity: 1, duration: .3 }, hit.t + .05);
    C.ranking.slots.forEach((s2, j) => { if (j !== i) tl.to('#rank' + j, { scale: 1, duration: .3 }, hit.t); });
  });
}
/* captions */
(C.captions || []).forEach((cap, ci) => {
  const t = cap[0], spans = document.querySelectorAll('#cap' + ci + ' span');
  const onsets = cap[2];
  tl.set('#cap' + ci, { opacity: 1 }, t);
  spans.forEach((sp, wi) => {
    tl.to(sp, { opacity: 1, duration: .12 }, onsets && onsets[wi] !== undefined ? onsets[wi] : t + wi * .16);
  });
  const next = (C.captions[ci + 1] || [DUR])[0];
  tl.to('#cap' + ci, { opacity: 0, duration: .18 }, Math.min(next - .18, t + 4.4));
});
tl.to({}, { duration: 0.01 }, DUR - 0.01);
</script>
